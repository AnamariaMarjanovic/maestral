<a class="skip-link" href="#main">Skip to content</a>

<header class="header">
  <a class="brand" routerLink="/">
    <svg class="brand__mark" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
      <defs>
        <mask id="ms-logo-wind">
          <rect width="48" height="48" fill="#fff" />
          <g fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round">
            <path d="M17 18 Q22 16.5 26 18" />
            <path d="M17 27 Q24 25 32 27" />
            <path d="M17 36 Q26 34 38 36" />
          </g>
        </mask>
      </defs>
      <path d="M11 43 V5 Q35 11 42 43 Z" mask="url(#ms-logo-wind)" />
    </svg>
    Maestral
  </a>
  <div class="header__actions">
    <docs-theme-toggle />
    <a class="header__link" href="https://github.com/AnamariaMarjanovic/maestral">GitHub</a>
  </div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Documentation">
    <h2 class="sidebar__heading">Getting started</h2>
    <ul class="sidebar__list">
      @for (item of gettingStarted; track item.path) {
        <li>
          <a
            class="sidebar__link"
            [routerLink]="item.path"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>

    <h2 class="sidebar__heading">Components</h2>
    <ul class="sidebar__list">
      @for (item of components; track item.path) {
        <li>
          <a
            class="sidebar__link"
            [routerLink]="item.path"
            routerLinkActive="sidebar__link--active"
            ariaCurrentWhenActive="page"
            >{{ item.label }}</a
          >
        </li>
      }
    </ul>
  </nav>

  <main id="main" class="main docs-page" tabindex="-1" #main>
    <router-outlet />
  </main>
</div>
