<main class="page">
  <h1>Maestral</h1>
  <p class="muted">Accessible Angular components, with forms and theming at the core.</p>

  <div class="swatches">
    <div class="swatch" style="background: var(--ms-color-primary); color: var(--ms-color-on-primary)">primary</div>
    <div class="swatch" style="background: var(--ms-color-surface)">surface</div>
    <div class="swatch" style="background: var(--ms-color-danger); color: var(--ms-color-on-danger)">danger</div>
  </div>

  <div class="swatches">
    <button msButton>Primary</button>
    <button msButton variant="secondary">Secondary</button>
    <button msButton variant="ghost">Ghost</button>
    <button msButton variant="danger">Delete</button>
    <button msButton disabled>Disabled</button>
  </div>

  <div class="swatches">
    <button msButton size="sm">Small</button>
    <button msButton>Medium</button>
    <button msButton size="lg">Large</button>
    <a msButton variant="secondary" href="https://github.com">Link as button</a>
  </div>

  <form class="form-demo" novalidate (submit)="onSubmit($event)">
    <ms-field label="Full name" hint="As it appears on your ID.">
      <input msInput [formField]="contactForm.name" autocomplete="name" />
    </ms-field>

    <ms-field label="Email">
      <input msInput type="email" [formField]="contactForm.email" autocomplete="email" />
    </ms-field>

    <ms-field label="Message" hint="Optional. At least 10 characters if you write one.">
      <textarea msInput [formField]="contactForm.message"></textarea>
    </ms-field>

    <div>
      <button msButton type="submit">Send</button>
    </div>

    @if (sent()) {
      <p role="status">Thanks, your message was sent.</p>
    }
  </form>
</main>
